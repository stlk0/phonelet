; Keep the column order: Phonelet replays this journal by position.
; Explicit UTC avoids host timezone ambiguity.
; STRFTIME makes res_cdrel_custom preserve this template's CSV quoting and column layout.
[mappings]
phonelet.csv => ${CSV_QUOTE(${CDR(uniqueid)})},${CSV_QUOTE(${CDR(channel)})},${CSV_QUOTE(${CDR(lastapp)})},${CSV_QUOTE(${CDR(src)})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(billsec)})},${CSV_QUOTE(${CDR(userfield)})},${CSV_QUOTE(${STRFTIME(${CDR(start,u)},UTC,%Y-%m-%dT%H:%M:%S%z)})}
