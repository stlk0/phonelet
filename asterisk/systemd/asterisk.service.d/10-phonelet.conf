# /usr/lib/systemd/system/asterisk.service.d/10-phonelet.conf, shipped in the Asterisk archive next to the
# unchanged upstream contrib/systemd/asterisk.service (scripts/build-asterisk.sh). Each setting is a
# difference from that unit, with its reason; docs/operations.md, "Asterisk service".
[Unit]
# AST_SIP_BIND to a static address needs that address configured before PJSIP binds it.
Wants=network-online.target
After=network-online.target
# A board without a real-time clock: start after the clock is restored from its saved value, so channel
# UniqueIDs (start time and a counter) do not repeat those written to CDR before the reboot.
After=time-set.target
# A crash loop must not reinitialise the modem forever: at most 5 starts in 10 minutes, then the modem
# monitor alerts and `systemctl reset-failed asterisk` allows new starts.
StartLimitIntervalSec=10min
StartLimitBurst=5

[Service]
# The build does not link libsystemd, so Asterisk never sends sd_notify READY=1.
Type=simple
# Phonelet runs Asterisk as root (there is no asterisk account): journals, recordings and logs are root's.
User=
Group=
# A hung shutdown is killed before the deploy engine's 120 s restart timeout.
TimeoutStopSec=45
# A restart kills only Asterisk, not the convert-recording.py and lame still converting a finished call.
KillMode=process
# No core files: they would hold SMS texts and secrets.
LimitCORE=0
# Files Asterisk creates (messages.log, recordings, CDR) are root's only: logs can hold numbers.
UMask=0077
# Upstream sends stdout to null; early fatal errors on stderr must still reach the journal.
StandardError=journal
# Sandboxing. Asterisk writes only under /var and /run (the recordings directory too: deploy keeps it
# out of the read-only /usr, /etc, /boot, /efi, /home, /root and /run/user and out of the private
# /tmp and /var/tmp), opens the modem ttys in /dev and uses UDP for SIP and RTP.
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
LockPersonality=yes
