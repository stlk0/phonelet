; Deploy unloads modules in this order; dependents must precede their dependencies.
[modules]
autoload=yes
; Phonelet uses PJSIP for SIP; keep other network listeners disabled.
noload => chan_iax2.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_sip.so
noload => chan_ooh323.so
noload => chan_motif.so
noload => res_xmpp.so
noload => pbx_dundi.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_hep.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
; AEL and Lua sample dialplans add contexts outside Phonelet.
noload => pbx_ael.so
noload => pbx_lua.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
